<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖纸 Logo 方案预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .section { padding: 40px 48px 52px; }
  .section.light { background:#FFFFFF; }
  .section.dark { background:#171717; }
  h2 { font-size:24px; font-weight:600; color:#1F1F1F; margin-bottom:8px; }
  .sub { font-size:14px; color:#A0A0A0; margin-bottom:28px; }
  .section.dark h2 { color:#F2F2F2; }
  .section.dark .sub { color:#707070; }
  .row { display:flex; gap:44px; flex-wrap:wrap; }
  .card { text-align:center; }
  .icon { width:132px; height:132px; border-radius:30px; margin-bottom:16px;
          box-shadow:0 14px 30px rgba(18,52,110,.20); }
  .icon img { width:100%; height:100%; border-radius:30px; display:block; }
  .section.dark .icon { box-shadow:0 14px 30px rgba(0,0,0,.55); }
  .name { font-size:15px; color:#6E6E6E; }
  .section.dark .name { color:#A6A6A6; }
  .badge { display:inline-block; margin-top:6px; font-size:12px; color:#1677FF;
           background:#E8F1FE; border-radius:99px; padding:2px 10px; }
</style>
</head>
<body>
  <div class="section light">
    <h2>糖纸 SugarPaper Logo 方案预览</h2>
    <div class="sub">品牌色：现代蓝 #1677FF · 浅色模式</div>
    <div class="row">
      <div class="card"><div class="icon"><img src="logo-concept-a-simple.svg" alt="A"></div><div class="name">A 极简对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-b-bubble.svg" alt="B"></div><div class="name">B 任务气泡</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-c-fold.svg" alt="C"></div><div class="name">C 折纸对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-d-plane.svg" alt="D"></div><div class="name">D 折纸飞机</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-e-sugar.svg" alt="E"></div><div class="name">E 方糖对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-f-s.svg" alt="F"></div><div class="name">F S 形纸带</div></div>
    </div>
  </div>
  <div class="section dark">
    <h2>深色模式</h2>
    <div class="sub">深色背景下的呈现</div>
    <div class="row">
      <div class="card"><div class="icon"><img src="logo-concept-a-simple.svg" alt="A"></div><div class="name">A 极简对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-b-bubble.svg" alt="B"></div><div class="name">B 任务气泡</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-c-fold.svg" alt="C"></div><div class="name">C 折纸对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-d-plane.svg" alt="D"></div><div class="name">D 折纸飞机</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-e-sugar.svg" alt="E"></div><div class="name">E 方糖对勾</div></div>
      <div class="card"><div class="icon"><img src="logo-concept-f-s.svg" alt="F"></div><div class="name">F S 形纸带</div></div>
    </div>
  </div>
</body>
</html>
