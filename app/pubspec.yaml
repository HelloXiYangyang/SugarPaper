name: sugarpaper
description: 糖纸 · SugarPaper —— 多平台作业管理助手（网页版 / 安卓 / Windows）
publish_to: "none"
version: 0.34.0+53

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  image: ^4.2.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^19.0.0
  speech_to_text: ^7.0.0
  cryptography: ^2.7.0
  flutter_webrtc: ^0.12.6
  file_picker: 10.3.3
  share_plus: 10.1.2
  package_info_plus: ^9.0.1
  dio: ^5.11.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FBDCE8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/avatar-default.jpg
    - assets/icon/
    - assets/legal/
