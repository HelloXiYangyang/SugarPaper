<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>糖纸 · SugarPaper</title>
  <meta name="description" content="让作业管理像糖果一样甜美简单 —— 离线优先的作业管理助手">
  <meta name="theme-color" content="#FBF6F2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="top-tabs" id="top-tabs" hidden></nav>
    <main class="shell" id="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <section class="view-wrap" id="view-wrap"></section>
      <aside class="right-panel" id="right-panel"></aside>
    </main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/account.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/report.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/ui-modals.js"></script>
  <script src="js/ui-home.js"></script>
  <script src="js/ui-calendar.js"></script>
  <script src="js/ui-stats.js"></script>
  <script src="js/ui-settings.js"></script>
  <script src="js/ui-notes.js"></script>
  <script src="js/ui-account.js"></script>
  <script src="js/ui-teacher.js"></script>
  <script src="js/ui-focus.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
  <script>
    // PWA 离线可用 + 零服务器自动更新（v0.27.0）：
    // Service Worker 缓存应用外壳；检测到新版 SW 时提示刷新
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          });
        }).catch(() => { /* 注册失败不影响使用 */ });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
    function showUpdateBanner() {
      const root = document.getElementById('toast-root') || document.body;
      const banner = document.createElement('div');
      banner.className = 'update-banner';
      banner.innerHTML = '<span>发现新版本</span>' +
        '<button class="btn small primary" data-update-refresh>立即刷新</button>';
      const btn = banner.querySelector('[data-update-refresh]');
      if (btn) {
        btn.addEventListener('click', () => {
          window.location.reload();
        });
      }
      root.appendChild(banner);
    }
  </script>
</body>
</html>
