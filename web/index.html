<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>糖纸 · SugarPaper</title>
  <meta name="description" content="让作业管理像糖果一样甜美简单 —— 离线优先的作业管理助手">
  <meta name="theme-color" content="#FBF6F2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="top-tabs" id="top-tabs" hidden></nav>
    <main class="shell" id="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <section class="view-wrap" id="view-wrap"></section>
      <aside class="right-panel" id="right-panel"></aside>
    </main>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/account.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/report.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/ui-modals.js"></script>
  <script src="js/ui-home.js"></script>
  <script src="js/ui-calendar.js"></script>
  <script src="js/ui-stats.js"></script>
  <script src="js/ui-settings.js"></script>
  <script src="js/ui-notes.js"></script>
  <script src="js/ui-account.js"></script>
  <script src="js/ui-teacher.js"></script>
  <script src="js/ui-focus.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
  <script>
    // PWA 离线可用 + 零服务器自动更新（v0.27.0）：
    // 启动后读取 updates/latest.json 对比版本号；Service Worker 检测到新版外壳时同样提示刷新
    if (window.Sugar && window.Sugar.updater) {
      window.addEventListener('load', () => window.Sugar.updater.init());
    }
  </script>
</body>
</html>
