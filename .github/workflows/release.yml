name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - run: flutter build apk --release --split-per-abi
        working-directory: app
      - name: 按命名规范重命名
        run: |
          VER=${GITHUB_REF_NAME#v}
          cp app/build/app/outputs/flutter-apk/app-release.apk "SugarPaper-v${VER}-android.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "SugarPaper-v${VER}-android-arm64-v8a.apk"
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "SugarPaper-v${VER}-android-armeabi-v7a.apk"
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk "SugarPaper-v${VER}-android-x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SugarPaper-v*-android*.apk

  windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress
      - name: 生成安装包并重命名
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$ver" 'packaging\windows\sugarpaper.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "build\windows\dist\v$ver\SugarPaper-v$ver-windows-x64.exe" "..\SugarPaper-v$ver-windows-x64.exe" -Force
          Get-FileHash -Algorithm SHA256 "..\SugarPaper-v$ver-windows-x64.exe" | Select-Object -ExpandProperty Hash
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: SugarPaper-v*-windows-x64.exe

  publish:
    name: 发布 Release 并更新元数据
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist
          pattern: SugarPaper-v*-windows-x64.exe
          merge-multiple: true

      - name: 计算 SHA-256 并提取版本信息
        id: meta
        run: |
          VER=${GITHUB_REF_NAME#v}
          SHA=$(sha256sum dist/SugarPaper-v${VER}-android.apk | awk '{print $1}')
          SHA_A64=$(sha256sum dist/SugarPaper-v${VER}-android-arm64-v8a.apk | awk '{print $1}')
          SHA_A7=$(sha256sum dist/SugarPaper-v${VER}-android-armeabi-v7a.apk | awk '{print $1}')
          SHA_X86=$(sha256sum dist/SugarPaper-v${VER}-android-x86_64.apk | awk '{print $1}')
          SHA_WIN=""
          if [ -f "dist/SugarPaper-v${VER}-windows-x64.exe" ]; then
            SHA_WIN=$(sha256sum "dist/SugarPaper-v${VER}-windows-x64.exe" | awk '{print $1}')
          fi
          PLATFORM="安卓版"
          [ -n "$SHA_WIN" ] && PLATFORM="安卓版 + Windows 版"
          # 主题：从 README 安卓版小节的最新版本日志标题中提取，如「S13 零服务器自动更新」
          THEME=""
          SECTION=$(grep -n "^## 📱 版本二" README.md | head -1 | cut -d: -f1)
          if [ -n "$SECTION" ]; then
            LINE=$(tail -n +$SECTION README.md | grep -m1 "^#### v${VER}（")
            if [ -n "$LINE" ]; then
              THEME=$(echo "$LINE" | sed -E 's/^#### v[0-9.]+（[^）]*）——[[:space:]]*//; s/（.*$//')
            fi
          fi
          [ -z "$THEME" ] && THEME="安卓版更新"
          # 更新日志：README 安卓版小节中该版本的条目（到下一个版本标题为止）
          LOG="- 完整更新日志见仓库 README。"
          if [ -n "$SECTION" ]; then
            START_LINE=$(tail -n +$SECTION README.md | grep -n "^#### v${VER}（" | head -1 | cut -d: -f1)
            if [ -n "$START_LINE" ]; then
              GLOBAL_START=$((SECTION + START_LINE - 1))
              END_LINE=$(awk -v s="$GLOBAL_START" 'NR>s && /^#### /{print NR; exit}' README.md)
              [ -z "$END_LINE" ] && END_LINE=$(wc -l < README.md)
              LOG=$(sed -n "$((GLOBAL_START+1)),$((END_LINE-1))p" README.md)
              [ -z "$LOG" ] && LOG="- 完整更新日志见仓库 README。"
            fi
          fi
          {
            echo "ver=$VER"
            echo "sha=$SHA"
            echo "sha_a64=$SHA_A64"
            echo "sha_a7=$SHA_A7"
            echo "sha_x86=$SHA_X86"
            echo "sha_win=$SHA_WIN"
            echo "platform=$PLATFORM"
            echo "theme=$THEME"
            echo "log<<GHLOG"
            echo "$LOG"
            echo "GHLOG"
          } >> "$GITHUB_OUTPUT"

      - name: 生成 Release 正文
        env:
          VER: ${{ steps.meta.outputs.ver }}
          THEME: ${{ steps.meta.outputs.theme }}
          SHA: ${{ steps.meta.outputs.sha }}
          SHA_A64: ${{ steps.meta.outputs.sha_a64 }}
          SHA_A7: ${{ steps.meta.outputs.sha_a7 }}
          SHA_X86: ${{ steps.meta.outputs.sha_x86 }}
          SHA_WIN: ${{ steps.meta.outputs.sha_win }}
          LOG: ${{ steps.meta.outputs.log }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { VER, THEME, SHA, SHA_A64, SHA_A7, SHA_X86, SHA_WIN, LOG } = process.env;
          const winRows = SHA_WIN
            ? `| [SugarPaper-v${VER}-windows-x64.exe](https://github.com/HelloXiYangyang/SugarPaper/releases/download/v${VER}/SugarPaper-v${VER}-windows-x64.exe) | Windows 桌面版安装包（x64，Inno Setup） |\n`
            : '';
          const winShaRows = SHA_WIN
            ? `| SugarPaper-v${VER}-windows-x64.exe | ${SHA_WIN} |\n`
            : '';
          const md = `## 版本概览

          糖纸 · SugarPaper v${VER}（${THEME}）：与网页版 v${VER} 功能对齐，正式发布。

          ## 更新内容

          ${LOG}

          ## 下载

          | 文件 | 说明 |
          | :--- | :--- |
          | [SugarPaper-v${VER}-android.apk](https://github.com/HelloXiYangyang/SugarPaper/releases/download/v${VER}/SugarPaper-v${VER}-android.apk) | 通用安装包（Android 5.0+，含全部 ABI，自动更新校验用此包） |
          | SugarPaper-v${VER}-android-arm64-v8a.apk | 仅 arm64-v8a（新机型，体积更小） |
          | SugarPaper-v${VER}-android-armeabi-v7a.apk | 仅 armeabi-v7a（较老机型） |
          | SugarPaper-v${VER}-android-x86_64.apk | 仅 x86_64（模拟器 / 部分平板） |
          ${winRows}

          SHA-256 校验值：

          | 文件 | SHA-256 |
          | :--- | :--- |
          | SugarPaper-v${VER}-android.apk | ${SHA} |
          | SugarPaper-v${VER}-android-arm64-v8a.apk | ${SHA_A64} |
          | SugarPaper-v${VER}-android-armeabi-v7a.apk | ${SHA_A7} |
          | SugarPaper-v${VER}-android-x86_64.apk | ${SHA_X86} |
          ${winShaRows}

          ## 安装说明

          1. Android：下载 APK 后用文件管理器打开安装，若提示「未知来源」请在系统设置中允许；
          2. Windows：下载 setup.exe 双击安装（未签名会有 SmartScreen 提示，属正常安全机制）；
          3. 数据默认保存在本机，账号同步为可选项，可放心试用。

          ## 反馈

          遇到问题请到 [Issues](https://github.com/HelloXiYangyang/SugarPaper/issues) 提交，附上设备型号、Android 版本、复现步骤。
          `;
          fs.writeFileSync('notes.md', md);
          EOF

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.meta.outputs.ver }}
          THEME: ${{ steps.meta.outputs.theme }}
          PLATFORM: ${{ steps.meta.outputs.platform }}
        run: |
          ARGS="dist/SugarPaper-v${VER}-android.apk dist/SugarPaper-v${VER}-android-arm64-v8a.apk dist/SugarPaper-v${VER}-android-armeabi-v7a.apk dist/SugarPaper-v${VER}-android-x86_64.apk"
          if [ -f "dist/SugarPaper-v${VER}-windows-x64.exe" ]; then
            ARGS="$ARGS dist/SugarPaper-v${VER}-windows-x64.exe"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "糖纸 · SugarPaper —— 多平台作业管理助手 · v${VER} · ${PLATFORM} · ${THEME}" \
            --notes-file notes.md \
            $ARGS

      - name: 更新 updates/latest.json（版本号 / build / sha256）
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          SHA_WIN: ${{ steps.meta.outputs.sha_win }}
          VER: ${{ steps.meta.outputs.ver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 必须 export，node 子进程才能通过 process.env.BUILD 读取
          export BUILD=$(grep '^version:' app/pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          node - <<'EOF'
          const fs = require('fs');
          const path = 'updates/latest.json';
          const j = JSON.parse(fs.readFileSync(path, 'utf8'));
          j.latest.version = process.env.VER;
          j.latest.build = Number(process.env.BUILD);
          j.latest.published_at = new Date().toISOString();
          j.platforms.android.url = `https://github.com/HelloXiYangyang/SugarPaper/releases/download/v${process.env.VER}/SugarPaper-v${process.env.VER}-android.apk`;
          j.platforms.android.sha256 = process.env.SHA;
          if (process.env.SHA_WIN) {
            j.platforms.windows = j.platforms.windows || {};
            j.platforms.windows.url = `https://github.com/HelloXiYangyang/SugarPaper/releases/download/v${process.env.VER}/SugarPaper-v${process.env.VER}-windows-x64.exe`;
            j.platforms.windows.sha256 = process.env.SHA_WIN;
          }
          fs.writeFileSync(path, JSON.stringify(j, null, 2) + '\n');
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先同步远端 main：标签触发的 checkout 处于 detached HEAD，
          # 显式基于最新 main 提交，避免非快进被拒（v0.31.0 曾因此回填失败）。
          git fetch origin main
          git checkout -B main FETCH_HEAD
          git add updates/latest.json
          git commit -m "chore(updates): 发布 v${VER} 同步 latest.json" || true
          git push origin main || { git pull --rebase origin main && git push origin main; }
          # GITHUB_TOKEN 的 push 不会触发 on:push 工作流，需显式触发 Pages 部署
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HelloXiYangyang/SugarPaper/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}' || true
