name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建官网（Vue 3 + Vuetify + vite-ssg）
        working-directory: homepage
        env:
          HUSKY: 0
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: 构建文档站（VuePress 2 + Theme Hope）
        working-directory: docs-src
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm docs:build

      - name: 构建网页版预览（Vue 3 + TS，重构中的新版本）
        working-directory: web-app
        run: |
          npm ci
          npm run build

      - name: 组装站点（官网 → 根路径，文档 → /docs/，网页版 → /app/，预览 → /app-preview/，元数据 → /updates/）
        run: |
          mkdir -p _site
          cp -r homepage/dist/* _site/
          cp -r docs-src/src/.vuepress/dist _site/docs
          cp -r web _site/app
          cp -r web-app/dist _site/app-preview
          cp -r updates _site/updates

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
